<!DOCTYPE html>
<html lang="en">
<head>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta charset="UTF-8" />
  <title>Duck Chess — 2 Player</title>
  <style>
    body { margin: 0; background: #1a1a1a; color: white; font-family: system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
    #board { width: min(90vw, 560px); height: min(90vw, 560px); display: grid; grid-template-columns: repeat(8, 1fr); border: 8px solid #5c4033; margin: 20px auto; }
    .square { display: flex; align-items: center; justify-content: center; cursor: pointer; position: relative; }
    .light { background: #f0d9b5; }
    .dark { background: #b58863; }
    .piece { width: 80%; height: 80%; background-size: contain; background-repeat: no-repeat; background-position: center; pointer-events: none; }
    .selected { outline: 3px solid #ffd700; }
    .legal { background: rgba(0, 200, 0, 0.35) !important; }
    #ui { text-align: center; margin: 10px; }
    input, button { padding: 8px 14px; font-size: 16px; margin: 4px; border-radius: 6px; border: none; }
    button { background: #4caf50; color: white; cursor: pointer; }
    #status { margin: 8px; font-size: 18px; }
  </style>
</head>
<body>
  <div id="ui">
    <h1>Duck Chess</h1>
    <div id="lobby">
      <button onclick="createRoom()">Create Room</button>
      <br>
      <input id="code" placeholder="Invite code" />
      <button onclick="joinRoom()">Join</button>
      <p id="roomStatus"></p>
    </div>
    <div id="status"></div>
  </div>
  <div id="board"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <script>
    const game = new Chess();
    let selected = null;
    let myColor = null;
    let peer, conn;
    const boardEl = document.getElementById("board");

    const sprites = {
      wP: "assets/models 2d/WPchess.png",
      wN: "assets/models 2d/Wknight.png",
      wB: "assets/models 2d/Wbishop.png",
      wR: "assets/models 2d/Wrook.png",
      wQ: "assets/models 2d/Wqueen.png",
      wK: "assets/models 2d/Wking.png",
      bP: "assets/models 2d/BPchess.png",
      bN: "assets/models 2d/Bknight.png",
      bB: "assets/models 2d/Bbishop.png",
      bR: "assets/models 2d/Brook.png",
      bQ: "assets/models 2d/Bqueen.png",
      bK: "assets/models 2d/Bking.png",
    };

    function render() {
      boardEl.innerHTML = "";
      const board = game.board();
      for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
          const sq = document.createElement("div");
          sq.className = "square " + ((r + c) % 2 === 0 ? "light" : "dark");
          const square = "abcdefgh"[c] + (8 - r);
          sq.dataset.square = square;
          const piece = board[r][c];
          if (piece) {
            const img = document.createElement("div");
            img.className = "piece";
            img.style.backgroundImage = `url('${sprites[piece.color + piece.type.toUpperCase()] || ""}')`;
            sq.appendChild(img);
          }
          sq.onclick = () => onSquareClick(square);
          boardEl.appendChild(sq);
        }
      }
      document.getElementById("status").textContent = game.game_over()
        ? (game.in_checkmate() ? "Checkmate" : "Draw")
        : (game.turn() === "w" ? "White" : "Black") + " to move";
    }

    function onSquareClick(square) {
      if (myColor && game.turn() !== myColor) return;
      if (selected) {
        const moves = game.moves({ square: selected, verbose: true });
        const move = moves.find(m => m.to === square);
        if (move) {
          game.move({ from: selected, to: square, promotion: "q" });
          if (conn && conn.open) conn.send({ from: selected, to: square });
          selected = null;
          render();
          return;
        }
      }
      const piece = game.get(square);
      if (piece && piece.color === game.turn()) {
        selected = square;
        highlightLegal(square);
      } else {
        selected = null;
        render();
      }
    }

    function highlightLegal(square) {
      render();
      const moves = game.moves({ square, verbose: true });
      document.querySelectorAll(".square").forEach(el => {
        if (el.dataset.square === square) el.classList.add("selected");
        if (moves.some(m => m.to === el.dataset.square)) el.classList.add("legal");
      });
    }

    function createRoom() {
      const code = Math.random().toString(36).substring(2, 8).toUpperCase();
      peer = new Peer(code);
      peer.on("open", id => {
        document.getElementById("roomStatus").innerHTML = "Invite code: <b>" + id + "</b><br>Waiting for opponent...";
        peer.on("connection", c => {
          conn = c;
          myColor = "w";
          setupConn();
          document.getElementById("roomStatus").textContent = "Connected — you are White";
          document.getElementById("lobby").style.display = "none";
          render();
        });
      });
    }

    function joinRoom() {
      const code = document.getElementById("code").value.trim().toUpperCase();
      if (!code) return;
      peer = new Peer();
      peer.on("open", () => {
        conn = peer.connect(code);
        conn.on("open", () => {
          myColor = "b";
          setupConn();
          document.getElementById("roomStatus").textContent = "Connected — you are Black";
          document.getElementById("lobby").style.display = "none";
          render();
        });
      });
    }

    function setupConn() {
      conn.on("data", data => {
        game.move({ from: data.from, to: data.to, promotion: "q" });
        render();
      });
    }

    render();
  </script>
</body>
</html>
